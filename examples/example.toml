# VMProtect Project Configuration File
# Example configuration for protecting an executable

# Input and output files
input_file = "input.exe"
output_file = "output.exe"

# VM section name (default: ".vmp")
vm_section_name = ".vmp"

# Protection options
[options]
# Debug mode - enables verbose logging
debug_mode = false

# Crypt values - encrypt constants
crypt_values = true

# Runner CRC - check file integrity at runtime
runner_crc = true

# Encrypt registers - encrypt register values during VM execution
encrypt_regs = true

# Strip fixups - remove relocation information
strip_fixups = false

# Pack - compress the output file
pack = true

# Import protection - protect import table
import_protection = true

# Check debugger - detect debuggers at runtime
check_debugger = false

# Check virtual machine - detect VMs at runtime
check_virtual_machine = false

# Memory protection - protect memory from modification
memory_protection = false

# Resource protection - encrypt resources
resource_protection = false

# Check kernel debugger - detect kernel debuggers
check_kernel_debugger = false

# Strip debug info - remove debug information
strip_debug_info = true

# Classic VM - use classic VM instead of new VM
classic_vm = false

# Loader CRC - check loader integrity
loader_crc = false

# Encrypt bytecode - encrypt VM bytecode
encrypt_bytecode = false

# Virtual files - enable virtual file system
virtual_files = false

# Internal memory protection - protect internal memory
internal_memory_protection = false

# Loader - use loader mode
loader = false

# Function protection settings
[[functions]]
id = "main"
name = "main"
address = 0x401000
compilation_type = "Ultra"
options = 0
folder = "entry"

[[functions]]
id = "encrypt"
name = "encrypt_data"
address = 0x402000
compilation_type = "Virtualization"
options = 0

[[functions]]
id = "check"
name = "check_license"
address = 0x403000
compilation_type = "Mutation"
options = 0

# Custom messages displayed at runtime
[messages]
debugger_found = "A debugger has been found running in your system.\nPlease, unload it from memory and restart your program."
virtual_machine_found = "Sorry, this application cannot run under a Virtual Machine."
file_corrupted = "File corrupted! This program has been manipulated and maybe\nit's infected by a Virus or cracked. This file won't work anymore."
serial_number_required = "This code requires valid serial number to run.\nProgram will be terminated."
hwid_mismatched = "This application cannot be executed on this computer."

# Licensing configuration (optional)
[licensing]
license_file = "license.vmp"
activation_server = "https://activation.vmprotect.com"
hwid = ""
