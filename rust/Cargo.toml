[workspace]
members = [
    "vmp-core",
    "vmp-cli",
    "vmp-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VMProtect Team"]
license = "MIT"
repository = "https://github.com/vmprotect/vmprotect"

[workspace.dependencies]
# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# 字节操作
bytes = "1.6"

# 进度条
indicatif = "0.17"
